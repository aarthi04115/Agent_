services:
  - type: web
    name: cyclecare-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cyclecare-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: llama-3.1-8b-instant
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: cyclecare-db
    databaseName: cyclecare
    user: cyclecare_user
